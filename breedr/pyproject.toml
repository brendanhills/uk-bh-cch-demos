[project]
name = "breedr"
version = "0.1.0"
description = "Ask questions of a database about farms"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Brendan Hills", email = "brendanhills@google.com" }]
dependencies = [
    "google-cloud-bigquery>=3.25.0,<4",
    "ipython>=8.27.0,<9",
    "ipykernel>=6.29.5,<7",
    "google-cloud-bigquery-storage>=2.25.0,<3",
    "pandas>=2.2.2,<3",
    "db-dtypes>=1.3.0,<2",
    "pip>=26.1.2",
    "pytest>=9.0.3",
    "tqdm>=4.66.5,<5",
    "ipywidgets>=8.1.5,<9",
    "bigquery-magics>=0.5.0,<0.6",
    "google-genai>=1.0.0,<2",
    "google-cloud-storage>=3.0.0,<4"
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
