[project]
name = "tda"
version = "0.1.0"
description = "CSIRO TDA Agent MVP Support"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "reportlab>=4.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scripts"]
