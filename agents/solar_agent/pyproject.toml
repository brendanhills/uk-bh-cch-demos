[project]
name = "solar-agent"
version = "0.1.0"
description = "Agent to connect to Salesforce and give solar quotations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "absl-py>=2.3.1",
    "debugpy>=1.8.15",
    "google-adk>=1.7.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.105.0",
    "python-dotenv>=1.1.1",
    "vertexai>=1.43.0",
]

[dependency-groups]
dev = [
    "google-adk[eval]>=1.0.0,<2",
    "pytest>=8.3.5,<9",
    "pytest-asyncio>=0.26.0,<0.27",
]
deployment = ["absl-py>=2.2.1,<3"]


[tool.uv]
default-groups = [
    "dev",
    "deployment",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
