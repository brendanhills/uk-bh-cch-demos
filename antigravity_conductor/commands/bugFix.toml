description = "Agile bug fixing protocol that analyzes, fixes, tests, and marks bugs as 'Fix Implemented'"
prompt = """
## 1.0 SYSTEM DIRECTIVE
You are an AI agent assistant for the Conductor spec-driven development framework. Your current task is to directly analyze, fix, and verify a bug in the active workspace.

CRITICAL: You must validate the success of every tool call. If any tool call fails, you MUST halt the current operation immediately, announce the failure to the user, and await further instructions.

---

## 1.1 SETUP CHECK
**PROTOCOL: Verify that we are operating in a valid workspace.**

1.  **Check Workspace Directory**: Verify that we can write/read the current workspace directory.
2.  **Ensure Folder Structure**: We will be reading/writing `.agents/bugs.json` under the current active workspace.

---

## 2.0 BUG RESOLUTION PROTOCOL
**PROTOCOL: Follow this sequence precisely to locate, diagnose, fix, and verify the bug.**

### 2.1 Locate Bug
1.  **Locate File**: Find `.agents/bugs.json` in the current active workspace.
2.  **Read and Parse**: Parse the file. If no unresolved bugs exist, announce:
    > "No active bugs to fix! All is clean."
    and halt.
3.  **Resolve Selection**:
    - **If a bug ID was provided as an argument (e.g., `{{args}}` is an integer)**:
      - Attempt to locate the bug with that specific ID.
      - If found, select it.
    - **If no bug ID was provided (or if lookup failed)**:
      - Filter the bugs list to find all unresolved bugs.
      - Call the `ask_user` tool (do not repeat in chat) to ask the user which bug they want to fix:
        - **questions**:
            - **header**: "Bug Fix Target"
            - **type**: "choice"
            - **multiSelect**: false
            - **question**: "Select an active bug to implement a fix for:"
            - **options**: (Construct options using ID and description)

### 2.2 Diagnose and Implement Fix
1.  **Announce Start**: Announce that you are beginning the fix protocol for bug **#<ID>** ("<Description>").
2.  **Locate Defect**:
    - Search the codebase using `grep_search` or look at relevant files based on the description.
    - Analyze the logic error or defect.
3.  **Implement Fix**:
    - Make precise code corrections using `replace_file_content` or `multi_replace_file_content`.
    - Preserve formatting, comments, and docstrings.

### 2.3 Run Verification Tests
1.  **Run Tests**: Propose and run the local testing command (e.g., `pytest` or `uv run pytest`) using the `run_command` tool.
2.  **Ensure Success**:
    - If any test fails, analyze the failure, adjust the fix, and re-run tests.
    - Do not mark the bug as fixed until ALL workspace tests pass cleanly.

### 2.4 Update Status
1.  **Mark Status**: Update the selected bug's status to `"Fix Implemented"` in the parsed array.
2.  **Save File**: Serialize and write the updated array pretty-printed back to `.agents/bugs.json`.
3.  **Announce Success**:
    - Report the successful fix, listing the specific files edited and confirming that all tests are passing:
    > "Successfully implemented fix for bug **#<ID>**!"
    > - **Description**: <Description>
    > - **Files Edited**: <list of edited files>
    > - **Verification Status**: PASS (All tests passing cleanly)
    > - **New Status**: Fix Implemented

"""
