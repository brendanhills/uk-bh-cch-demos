description = "Saves session progress, updates tracks/README/resume.md, commits, and pushes"
prompt = """
## 1.0 SYSTEM DIRECTIVE
You are an AI agent assistant for the Conductor spec-driven development framework. Your current task is to perform an end-of-session checkpoint. You MUST follow this protocol precisely.

CRITICAL: You must validate the success of every tool call. If any tool call fails, you MUST halt the current operation immediately, announce the failure to the user, and await further instructions.

---

## 1.1 SETUP CHECK
**PROTOCOL: Verify Conductor installation and tracks status.**

1.  **Verify Conductor Installation**:
    - Check if the `conductor/` directory exists and has a `tracks.md` file in the current active workspace.
    - **If NOT installed/set up**:
      - Do not fail. Instead, present a helpful guide showing the user how to set up Conductor:
        > "Conductor is not yet set up in this workspace! Setting up Conductor allows you to manage product specs, tech stacks, workflows, and features using structured tracks.
        > 
        > To install and initialize Conductor, simply run the `/conductor:setup` slash command in the chat."
    - **If installed**:
      - Read `conductor/tracks.md`.
      - Find the active track (marked with `[~]` or the most recently updated track directory).
      - If no track is in progress, note this gracefully to the user and continue.
      - If an active track is found, read its `plan.md` and check off completed/in-progress tasks based on the work completed in this session. Update track states in `conductor/tracks.md` or `metadata.json` if appropriate.

---

## 2.0 AUDIT CHANGES & UPDATE README
**PROTOCOL: Audit recent session changes and synchronize the root documentation.**

1.  **Audit Changes**:
    - Run `git status` and inspect recent diffs to see what files were created, modified, or deleted in this session.
    - Categorize the changes (e.g., core features, API changes, bug fixes, dev environment updates).
2.  **Synchronize README.md**:
    - Read the project's root `README.md`. If it does not exist, create a new, high-quality, professional `README.md`.
    - If the file exists, update it to reflect any new functionality, configuration options, or architectural changes implemented during this session.

---

## 3.0 GENERATE resume.md
**PROTOCOL: Create or update a durable session handoff file.**

1.  **Create/Overwrite `resume.md`**: Create or update a `resume.md` file at the root of the project workspace.
2.  **Structure of `resume.md`**:
    Ensure the generated file follows this standard markdown layout:
    
    ```markdown
    # Working Session Handoff: [Date/Time]

    ## 📝 Session Summary
    - **What we did**: [Brief bulleted list of features implemented, bugs fixed, or tasks completed in this session]
    - **Workspace State**: [Active branch name, files changed, uncommitted/stashed changes]

    ## 📌 Current Context & Progress
    - **Active Track**: [Track Description & link to folder, if Conductor is set up]
    - **Last Active Task**: [The task/subtask we were working on when the session ended]

    ## 🚦 Remaining Tasks & Blockers
    - [Uncompleted tasks from the current phase/track]
    - [Any known bugs, unresolved lints, or things left broken/partially implemented]

    ## 🚀 Immediate Next Steps
    1. [Clear, numbered action step #1 to resume work]
    2. [Action step #2]
    ```

---

## 4.0 GIT COMMIT & BRANCH PROTOCOL
**PROTOCOL: Commit session progress safely, branching off protected branches if necessary.**

1.  **Determine Active Branch**: Run `git rev-parse --abbrev-ref HEAD` to check the current branch.
2.  **Branch Check & Safe Creation**:
    - If the current branch is `main`, `master`, or detached HEAD:
      - Propose creating a new session branch so work is not committed directly to production/main branches.
      - Generate a clean branch name based on the current date or session (e.g., `session/checkpoint-YYYYMMDD-HHMM`).
      - Create and switch to the new branch: `git checkout -b <branch_name>`.
3.  **Commit Changes**:
    - Stage all changes (including code edits, `README.md`, `resume.md`, and Conductor tracks if changed): `git add .`
    - Commit changes with a clean, descriptive message: `checkpoint: Working session progress for [Date/Time]`
4.  **Push to Origin**:
    - Ask the user using the `ask_user` tool (do not repeat in chat) on whether they want to push the committed branch to origin:
      - **questions**:
          - **header**: "Push Checkpoint"
          - **type**: "yesno"
          - **question**: "Would you like to push the committed checkpoint branch to origin?"
    - If confirmed, execute `git push -u origin <current_branch>`. If a new branch was created, use the appropriate upstream flag.

---

## 5.0 FINAL ANNOUNCEMENT
**PROTOCOL: Summarize results, trigger learning, and guide the next session.**

1.  **Trigger Learn Protocol**:
    - You MUST trigger and run the `/learn` slash command protocol. This is to persist any reusable behaviors, user corrections, config tweaks, or successes from the current working session. Iterate interactively with the user to clarify what behavior to retain as updated/new skills or rules.

2.  **Summarize Session Checkpoint**:
    - Present the final summary of the checkpoint results to the user.
    - Inform them of the branch name, the commit made, whether it was pushed, and remind them they can run `/resume` or the `resume` skill next time to pick up immediately!


"""
