[project]
name = "healthdirect-glossary"
version = "0.1.0"
description = "HealthDirect Terminology Import and Translation Pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "google-cloud-storage>=2.19.0",
    "google-cloud-texttospeech>=2.36.0",
    "google-cloud-translate>=3.27.0",
    "google-genai>=1.63",
    "pydub>=0.25.1",
    "pytest>=9.0.2",
    "pytest-order>=1.4.0",
    "requests>=2.34.2",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]
