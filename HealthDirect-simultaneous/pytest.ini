[pytest]
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Add asyncio mode for async tests
asyncio_mode = auto

# Restrict test discovery path to 'tests' to make collection fast
testpaths = tests

# Ignore virtual environments and other non-test directories during discovery
norecursedirs = .venv .git .pytest_cache .vscode archive conductor output samples long_tests