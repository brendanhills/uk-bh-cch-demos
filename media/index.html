<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lipstick Product Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="product-image">
            <img src="https://via.placeholder.com/400x400.png?text=Lipstick" alt="Lipstick">
        </div>
        <div class="product-details">
            <h1 class="product-title">Velvet Matte Lipstick</h1>
            <p class="product-description">A luxurious, long-lasting matte lipstick that provides a bold and velvety finish. Enriched with vitamin E to keep your lips moisturized.</p>
            <p class="product-price">$25.00</p>
            <div class="product-options">
                <label for="color">Color:</label>
                <select id="color" name="color">
                    <option value="red">Fiery Red</option>
                    <option value="pink">Blushing Pink</option>
                    <option value="nude">Natural Nude</option>
                </select>
            </div>
            <button class="add-to-cart-btn">Add to Cart</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
